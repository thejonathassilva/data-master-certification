server:
  port: 8080

spring:
  main:
    web-application-type: servlet
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/nlp}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

predict:
  base-url: ${PREDICT_API_BASE_URL:http://localhost:8000}
j-assistant:
  base-url: ${J_ASSISTANT_API_BASE_URL:http://j-assistant-predict-api:8001}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
topics:
  trainRequests: train.requests
  trainStatus: train.status

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: config-api
