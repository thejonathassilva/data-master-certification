<div class="page--wide">
  <form [formGroup]="form" (ngSubmit)="save()" class="form" style="max-width: 900px">
    <div style="display:flex; gap:16px; flex-wrap:wrap">
      <mat-form-field appearance="outline" style="flex:1 1 280px; min-width:260px">
        <mat-label>Assunto</mat-label>
        <mat-select formControlName="subjectId">
          <mat-option *ngFor="let s of subjects" [value]="s.id">{{ s.name }}</mat-option>
        </mat-select>
      </mat-form-field>
  
      <mat-form-field appearance="outline" style="flex:1 1 280px; min-width:260px">
        <mat-label>Nome da Intenção</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>
  
      <mat-form-field appearance="outline" style="flex:0 1 160px; min-width:160px">
        <mat-label>Ativa?</mat-label>
        <input matInput [value]="form.value.active ? 'Sim' : 'Não'" disabled />
      </mat-form-field>
    </div>
  
    <mat-divider style="margin: 12px 0;"></mat-divider>
  
    <div formArrayName="examples" style="display:flex; flex-direction:column; gap:10px">
      <div *ngFor="let ctrl of examplesFA.controls; let i = index" style="display:flex; gap:8px; align-items:center">
        <mat-form-field appearance="outline" style="flex:1">
          <mat-label>Exemplo {{ i + 1 }}</mat-label>
          <input matInput [formControlName]="i" placeholder="Digite um exemplo de usuário..." />
        </mat-form-field>
  
        <!-- botão adicionar abaixo deste -->
        <button mat-icon-button color="primary" type="button" (click)="addExample(i)" matTooltip="Adicionar exemplo">
          <mat-icon>add</mat-icon>
        </button>
  
        <!-- remover -->
        <button mat-icon-button color="warn" type="button" (click)="removeExample(i)" [disabled]="examplesFA.length<=1"
          matTooltip="Remover este exemplo">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
  
      <!-- opcional: botão para adicionar no final -->
      <div>
        <button mat-stroked-button color="primary" type="button" (click)="addExample()">Adicionar exemplo</button>
      </div>
    </div>
  
    <div class="actions" style="margin-top:16px; display:flex; gap:8px">
      <button mat-raised-button color="primary" type="submit">Salvar</button>
      <button mat-stroked-button type="button" (click)="previewIntent()" [disabled]="loadingPreview">
        <ng-container *ngIf="!loadingPreview">Prévia</ng-container>
        <mat-progress-spinner *ngIf="loadingPreview" diameter="18" mode="indeterminate"></mat-progress-spinner>
      </button>
      <a mat-button routerLink="/intents">Cancelar</a>
    </div>
  </form>
</div>
