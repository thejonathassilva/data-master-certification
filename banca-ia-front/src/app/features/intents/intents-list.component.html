<div class="page--wide">
  <div class="toolbar">
    <a mat-raised-button color="primary" routerLink="new">Nova Intenção</a>
  </div>
  <table mat-table [dataSource]="data" class="mat-elevation-z1">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Nome</th>
      <td mat-cell *matCellDef="let i">{{i.name}}</td>
    </ng-container>
    <ng-container matColumnDef="subjectId">
      <th mat-header-cell *matHeaderCellDef>Assunto</th>
      <td mat-cell *matCellDef="let i">{{sName(i.subjectId)}}</td>
    </ng-container>
    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef>Ativa</th>
      <td mat-cell *matCellDef="let i">{{i.active ? 'Sim':'Não'}}</td>
    </ng-container>
    <ng-container matColumnDef="examples">
      <th mat-header-cell *matHeaderCellDef>Exemplos</th>
      <td mat-cell *matCellDef="let i">{{i.examples?.length || 0}}</td>
    </ng-container>
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let i">
        <a mat-button color="primary" [routerLink]="[i.id]">Editar</a>
        <button mat-button color="warn" (click)="remove(i.id)">Excluir</button>
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
