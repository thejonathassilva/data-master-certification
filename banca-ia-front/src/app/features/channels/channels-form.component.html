<div class="page--wide">
  <form [formGroup]="form" (ngSubmit)="save()" class="form">
    <mat-form-field appearance="outline">
      <mat-label>Nome</mat-label>
      <input matInput formControlName="name">
    </mat-form-field>
  
    <mat-form-field appearance="outline">
      <mat-label>Min confiança (assunto)</mat-label>
      <input matInput type="number" formControlName="minConfSubject" step="0.01" min="0" max="1">
    </mat-form-field>
  
    <div class="actions">
      <button mat-raised-button color="primary">Salvar</button>
      <a mat-button routerLink="/channels">Cancelar</a>
    </div>
  </form>
</div>
